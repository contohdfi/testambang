<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Harian - Tambang Jogosari</title>
    <!-- Memuat Bootstrap 5 dari CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4 text-secondary">Dashboard Harian (Hari Ini)</h2>

        <!-- BARIS PERTAMA: CARD STATISTIK -->
        <div class="row mb-4">
            <!-- Card Pemasukan -->
            <div class="col-md-3 mb-3">
                <div class="card bg-success text-white shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Total Pemasukan</h6>
                        <h4 id="teksPemasukan">Loading...</h4>
                    </div>
                </div>
            </div>
            
            <!-- Card Pengeluaran -->
            <div class="col-md-3 mb-3">
                <div class="card bg-danger text-white shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Total Pengeluaran</h6>
                        <h4 id="teksPengeluaran">Loading...</h4>
                    </div>
                </div>
            </div>

            <!-- Card Saldo -->
            <div class="col-md-3 mb-3">
                <div class="card bg-primary text-white shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Saldo Hari Ini</h6>
                        <h4 id="teksSaldo">Loading...</h4>
                    </div>
                </div>
            </div>

            <!-- Card Total Rit Truk -->
            <div class="col-md-3 mb-3">
                <div class="card bg-warning text-dark shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Jumlah Truk / Rit</h6>
                        <h4 id="teksRit">Loading...</h4>
                    </div>
                </div>
            </div>
        </div>

        <!-- BARIS KEDUA: TABEL TRANSAKSI -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">Data Transaksi Hari Ini</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Waktu</th>
                                <th>Jenis</th>
                                <th>Detail Transaksi</th>
                                <th>Nominal</th>
                                <th>P.Jawab</th>
                                <th>Status / Info</th>
                            </tr>
                        </thead>
                        <tbody id="tabelTransaksi">
                            <tr>
                                <td colspan="6" class="text-center py-3">Sedang memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Menghubungkan file JavaScript -->
    <script src="js/dashboard.js"></script>
</body>
</html>
